name: WalkArrow

options:
  bundleIdPrefix: com.lxxjs
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Fill in your Apple Developer team, or set it once in Xcode's Signing tab.
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # ---------------------------------------------------------------- iOS app
  WalkArrow:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxxjs.walkarrow
        PRODUCT_NAME: WalkArrow
        INFOPLIST_FILE: Sources/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/WalkArrow.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: WalkArrowShare
        embed: true
      - target: WalkArrowWatch
        embed: true

  # ------------------------------------------------------- Share extension
  # How a Naver Map destination gets in: Naver has no plug-in surface, so the
  # iOS share sheet is the hand-off.
  WalkArrowShare:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/Share
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxxjs.walkarrow.share
        PRODUCT_NAME: WalkArrowShare
        INFOPLIST_FILE: Sources/Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Share/WalkArrowShare.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # -------------------------------------------------------- watchOS app
  # watchOS 10 rather than 9 so the modern SwiftUI toolbar APIs are available;
  # it still reaches back to Apple Watch Series 4. The compass arrived with
  # Series 5, and older watches fall back to GPS course while walking.
  WalkArrowWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/Shared
      - Sources/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxxjs.walkarrow.watchkitapp
        PRODUCT_NAME: WalkArrow
        INFOPLIST_FILE: Sources/Watch/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Watch/WalkArrowWatch.entitlements
        GENERATE_INFOPLIST_FILE: NO

  # ------------------------------------------------------------------ Tests
  # The shared sources are compiled straight into the test target, so the geo
  # and parsing layers are exercised without a host app.
  WalkArrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Sources/Shared
      - Tests/SharedTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxxjs.walkarrow.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WalkArrow:
    build:
      targets:
        WalkArrow: all
        WalkArrowTests: [test]
    test:
      targets:
        - WalkArrowTests
  WalkArrowWatch:
    build:
      targets:
        WalkArrowWatch: all
